<!-- 地圖頁模板 A：極簡風 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RwaRwaSol 地圖（風格 A）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body, html { margin: 0; padding: 0; height: 100%; }
#map { width: 100%; height: 100vh; }
.marker-title { font-weight: bold; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([25.033, 121.565], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19,
}).addTo(map);


fetch('/api/all-places')
.then(res => res.json())
.then(data => {
data.results.forEach(item => {
const marker = L.marker([item.lat, item.lng]).addTo(map);
marker.bindPopup(`
<div class="marker-title">${item.caseName}</div>
<div>${item.author || ''}</div>
<a href="/place/${item.id}" target="_blank">查看介紹</a>
`);
});
});
</script>
</body>
</html>
